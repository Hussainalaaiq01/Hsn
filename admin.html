<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#07080F;--t:#F5F6FA;--m:rgba(245,246,250,.6);--g:#E9CF9B;--c:rgba(255,255,255,.07);--e:rgba(255,255,255,.16)}
*{box-sizing:border-box}
body{margin:0;padding:1.2rem 1.2rem 6rem;background:radial-gradient(900px 500px at 90% -10%,rgba(91,61,245,.35),transparent),radial-gradient(700px 500px at -10% 60%,rgba(14,165,233,.28),transparent),var(--bg);color:var(--t);font-family:'Cairo',Tahoma,sans-serif;line-height:1.7}
.w{max-width:900px;margin:0 auto}
h1{font-size:1.8rem;margin:.5rem 0}
h2{font-size:1.2rem;margin:0 0 .8rem;color:var(--g)}
h3{font-size:1rem;margin:1.2rem 0 .3rem;color:var(--m)}
.card{background:var(--c);border:1px solid var(--e);border-radius:22px;padding:1.3rem;margin:1rem 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.4rem 0}
input,textarea,select{width:100%;font:inherit;color:var(--t);background:rgba(0,0,0,.3);border:1px solid var(--e);border-radius:12px;padding:.55rem .8rem}
textarea{resize:vertical;min-height:2.6rem}
label{display:block;font-size:.85rem;color:var(--m);margin-top:.6rem}
.btn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.7rem 1.6rem;cursor:pointer;background:linear-gradient(135deg,#F3DFAE,#E9CF9B);color:#2A2110}
.btn.g{background:var(--c);color:var(--t);border:1px solid var(--e)}
.bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:.6rem;padding:.6rem;border-radius:999px;background:rgba(20,22,35,.9);border:1px solid var(--e);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}
.cc{border:1px solid var(--e);border-radius:16px;padding:.9rem;margin:.7rem 0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.sm{font:inherit;font-size:.8rem;border:1px solid var(--e);background:var(--c);color:var(--t);border-radius:10px;padding:.2rem .7rem;cursor:pointer;margin-inline-start:.3rem}
.sm.dl{color:#ff8a8a}
.tn{width:90px;height:60px;object-fit:cover;border-radius:8px;margin:.5rem .5rem 0 0}
.st{color:var(--m)}
@media (max-width:640px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
  <h1>لوحة التحكم</h1>
  <p class="st" id="st">جارٍ تحميل الموقع...</p>

  <div class="card" id="pick" hidden>
    <h2>اختر ملف الموقع</h2>
    <p class="st">لم أجد ملف الموقع تلقائياً. اختر ملف الموقع (index.html) من جهازك.</p>
    <input type="file" id="fi" accept=".html,text/html">
  </div>

  <div id="ui" hidden>
    <div class="card"><h2>الخط</h2><select id="font"></select></div>

    <div class="card">
      <h2>معلومات التواصل</h2>
      <label>البريد الإلكتروني</label><input id="em" dir="ltr">
      <label>رقم الواتساب (مع رمز الدولة)</label><input id="wa" dir="ltr" placeholder="+964 7XX XXX XXXX">
      <label>رابط الإنستغرام</label><input id="ig" dir="ltr" placeholder="https://instagram.com/اسم_حسابك">
    </div>

    <div class="card">
      <h2>البطاقات (الأعمال والورش)</h2>
      <p class="st">أضف بطاقة أو احذفها أو غيّر ترتيبها وحجمها وصورتها. الحقل الأول بالعربية والثاني بالإنجليزية.</p>
      <div id="cd"></div>
    </div>

    <div class="card">
      <h2>باقي النصوص</h2>
      <div class="row st"><span>العربية</span><span dir="ltr">English</span></div>
      <div id="tx"></div>
    </div>

    <div class="bar"><button class="btn g" id="pv">معاينة</button><button class="btn" id="dl">تنزيل الملفات المحدّثة</button></div>
  </div>
</div>

<script>
var FONTS=[['Cairo','Cairo:wght@300;400;500;600;700'],['Tajawal','Tajawal:wght@300;400;500;700'],['Almarai','Almarai:wght@300;400;700'],['IBM Plex Sans Arabic','IBM+Plex+Sans+Arabic:wght@300;400;500;600;700'],['El Messiri','El+Messiri:wght@400;500;600;700'],['Readex Pro','Readex+Pro:wght@300;400;500;600;700'],['Noto Kufi Arabic','Noto+Kufi+Arabic:wght@300;400;500;600;700']];
var GN={top:'الرئيسية',services:'الخدمات',works:'أعمالي',workshops:'الورش التدريبية',free:'الموارد المجانية',about:'نبذة عني',contact:'التواصل'};
var ORDER=['الرئيسية','الخدمات','الموارد المجانية','نبذة عني','التواصل','عام'];
var SKIP={'.work small':1,'.work h3':1,'.work p':1};
var SRC='',EN={},F=[],CG=[[],[]],GT=['',''],OLDWA='',BL=[];
function $(i){return document.getElementById(i)}
function parse(t){return new DOMParser().parseFromString(t,'text/html')}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function fld(v){var e=document.createElement(v.length>50?'textarea':'input');e.value=v;if(v.length>50)e.rows=Math.ceil(v.length/45);return e}
function en(k,i){return (EN[k]||[])[i]||''}

function load(t){
  var m=t.match(/var EN=(\{[\s\S]*?\n\});\s*var AR=/);
  if(!m){$('st').textContent='لم أتعرف على بنية الملف. تأكد أنه ملف الموقع الصحيح.';$('pick').hidden=false;return}
  SRC=t;EN=new Function('return '+m[1])();
  var d=parse(t);
  $('st').textContent='تم تحميل الموقع. عدّل ما تريد ثم اضغط «تنزيل الملفات المحدّثة».';
  $('pick').hidden=true;$('ui').hidden=false;

  var fm=t.match(/font-family:'([^']+)',Tahoma/),cf=fm?fm[1]:'';
  $('font').innerHTML=FONTS.map(function(f,i){return '<option value="'+i+'"'+(f[0]===cf?' selected':'')+'>'+f[0]+'</option>'}).join('');

  var a=d.querySelector('a[href^="mailto:"]');$('em').value=a?a.getAttribute('href').slice(7):'';
  var w=d.querySelector('.wa');OLDWA=w?w.textContent:'';$('wa').value=OLDWA;
  a=d.querySelector('a[href*="instagram.com"]');$('ig').value=a?a.getAttribute('href'):'';

  CG=[[],[]];GT=['',''];
  var ci=0,pi=0;
  d.querySelectorAll('.grid').forEach(function(g,gi){
    if(gi>1)return;
    var sec=g.closest('section[id]');
    GT[gi]=(sec&&GN[sec.id])||'البطاقات';
    Array.prototype.forEach.call(g.children,function(w){
      if(!w.classList.contains('work'))return;
      var art=w.querySelector('.art'),im=art.querySelector('img'),ic=art.querySelector('i'),p=w.querySelector('p');
      CG[gi].push({
        g:(art.className.match(/g\d/)||['g1'])[0],letter:ic?ic.textContent:'',
        img:im?im.getAttribute('src'):'',blob:null,
        size:w.classList.contains('big')?'big':(w.classList.contains('sm')?'sm':''),
        btn:w.getAttribute('data-btn'),btnEn:w.getAttribute('data-btn-en'),
        tag:[w.querySelector('small').textContent,en('.work small',ci)],
        title:[w.querySelector('h3').textContent,en('.work h3',ci)],
        desc:p?[p.textContent,en('.work p',pi++)]:['','']
      });
      ci++;
    });
  });
  renderCards();

  var G={};
  Object.keys(EN).forEach(function(s){
    if(SKIP[s])return;
    var els=d.querySelectorAll(s);
    EN[s].forEach(function(e,i){
      var x=els[i];if(!x)return;
      var sec=x.closest('section[id],header[id]'),g=(sec&&GN[sec.id])?GN[sec.id]:'عام';
      (G[g]=G[g]||[]).push({s:s,i:i,ar:x.textContent,en:e});
    });
  });
  var tx=$('tx');tx.innerHTML='';F=[];
  ORDER.forEach(function(g){
    if(!G[g])return;
    tx.appendChild(el('h3','',g));
    G[g].forEach(function(x){
      var r=el('div','row'),a=fld(x.ar),e=fld(x.en);e.dir='ltr';
      r.appendChild(a);r.appendChild(e);tx.appendChild(r);
      F.push({s:x.s,i:x.i,a:a,e:e});
    });
  });
}

function renderCards(){
  var cd=$('cd');cd.innerHTML='';
  [0,1].forEach(function(gi){
    if(!GT[gi])return;
    cd.appendChild(el('h3','',GT[gi]));
    CG[gi].forEach(function(c,k){cd.appendChild(cardEl(c,gi,k))});
    var ad=el('button','btn g','+ إضافة بطاقة');ad.style.marginTop='.6rem';
    ad.onclick=function(){addCard(gi)};cd.appendChild(ad);
  });
}

function cardEl(c,gi,k){
  var b=el('div','cc'),hd=el('div','ch'),bs=el('span');
  hd.appendChild(el('b','',(k+1)+'. '+(c.title[0]||'بدون عنوان')));
  [['↑',-1],['↓',1]].forEach(function(x){
    var m=el('button','sm',x[0]);m.onclick=function(){mv(gi,k,x[1])};bs.appendChild(m);
  });
  var del=el('button','sm dl','حذف');
  del.onclick=function(){if(confirm('حذف هذه البطاقة؟')){CG[gi].splice(k,1);renderCards()}};
  bs.appendChild(del);hd.appendChild(bs);b.appendChild(hd);

  [['التصنيف','tag'],['العنوان','title'],['الوصف (اتركه فارغاً لإخفائه)','desc']].forEach(function(x){
    b.appendChild(el('label','',x[0]));
    var r=el('div','row'),a=fld(c[x[1]][0]),e=fld(c[x[1]][1]);e.dir='ltr';
    a.oninput=function(){c[x[1]][0]=a.value};
    e.oninput=function(){c[x[1]][1]=e.value};
    r.appendChild(a);r.appendChild(e);b.appendChild(r);
  });

  b.appendChild(el('label','','الحجم والصورة'));
  var r2=el('div','row'),sel=el('select');
  [['','حجم عادي'],['big','كبيرة'],['sm','صغيرة']].forEach(function(o){
    var op=el('option','',o[1]);op.value=o[0];if(c.size===o[0])op.selected=true;sel.appendChild(op);
  });
  sel.onchange=function(){c.size=sel.value};
  var fi=el('input');fi.type='file';fi.accept='image/*';
  r2.appendChild(sel);r2.appendChild(fi);b.appendChild(r2);

  var pv=el('img','tn'),rm=el('button','sm','إزالة الصورة');
  function show(){var s=c.blob?URL.createObjectURL(c.blob):c.img;pv.hidden=!s;if(s)pv.src=s}
  pv.onerror=function(){pv.hidden=true};
  fi.onchange=function(){if(fi.files[0])shrink(fi.files[0]).then(function(bl){c.blob=bl;c.img='';show()})};
  rm.onclick=function(){c.blob=null;c.img='';show()};
  show();b.appendChild(pv);b.appendChild(rm);
  return b;
}

function mv(gi,k,d){
  var L=CG[gi],j=k+d;if(j<0||j>=L.length)return;
  var t=L[k];L[k]=L[j];L[j]=t;renderCards();
}

function addCard(gi){
  var n=CG[0].length+CG[1].length,wk=gi===1;
  CG[gi].push({
    g:'g'+((n%6)+1),letter:'',img:'',blob:null,size:'',
    btn:wk?'احجز مقعدك':null,btnEn:wk?'Book your seat':null,
    tag:['جديد','New'],title:['عنوان جديد','New title'],
    desc:wk?['','']:['وصف قصير','Short description']
  });
  renderCards();
}

function shrink(file){
  return new Promise(function(res){
    var im=new Image();
    im.onload=function(){
      var s=Math.min(1,900/im.width),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      c.toBlob(function(b){res(b)},'image/jpeg',.82);
    };
    im.src=URL.createObjectURL(file);
  });
}

function mk(d,c,src){
  var a=d.createElement('article');a.className='work glass'+(c.size?' '+c.size:'');
  if(c.btn!=null){a.setAttribute('data-btn',c.btn);a.setAttribute('data-btn-en',c.btnEn||'')}
  var art=d.createElement('div');art.className='art '+c.g;
  if(src){var im=d.createElement('img');im.setAttribute('src',src);im.setAttribute('alt','');im.setAttribute('loading','lazy');art.appendChild(im)}
  else{var i=d.createElement('i');i.textContent=c.letter||(c.title[0]||'').trim().charAt(0);art.appendChild(i)}
  var m=d.createElement('div');m.className='meta';
  var s=d.createElement('small');s.textContent=c.tag[0];
  var h=d.createElement('h3');h.textContent=c.title[0];
  m.appendChild(s);m.appendChild(h);
  if(c.desc[0].trim()){var p=d.createElement('p');p.textContent=c.desc[0];m.appendChild(p)}
  a.appendChild(art);a.appendChild(m);return a;
}

function build(prev){
  BL=[];
  var d=parse(SRC);
  F.forEach(function(f){var x=d.querySelectorAll(f.s)[f.i];if(x)x.textContent=f.a.value});
  var en2={};
  Object.keys(EN).forEach(function(s){en2[s]=EN[s].slice()});
  F.forEach(function(f){en2[f.s][f.i]=f.e.value});

  var gr=d.querySelectorAll('.grid'),sm=[],h3=[],ps=[],n=0,ts=Date.now();
  [0,1].forEach(function(gi){
    var g=gr[gi];if(!g)return;
    g.innerHTML='';
    CG[gi].forEach(function(c){
      var src=c.img;
      if(c.blob){
        if(prev)src=URL.createObjectURL(c.blob);
        else{var nm='w-'+ts+'-'+(n++)+'.jpg';BL.push({n:nm,b:c.blob});src='images/'+nm}
      }
      g.appendChild(mk(d,c,src));
      sm.push(c.tag[1]);h3.push(c.title[1]);
      if(c.desc[0].trim())ps.push(c.desc[1]);
    });
  });
  en2['.work small']=sm;en2['.work h3']=h3;en2['.work p']=ps;

  var em=$('em').value.trim(),wa=$('wa').value.trim(),ig=$('ig').value.trim(),dg=wa.replace(/\D/g,'');
  if(em)d.querySelectorAll('a[href^="mailto:"]').forEach(function(a){a.setAttribute('href','mailto:'+em)});
  if(dg)d.querySelectorAll('a[href^="https://wa.me/"]').forEach(function(a){a.setAttribute('href','https://wa.me/'+dg)});
  if(ig)d.querySelectorAll('a[href*="instagram.com"]').forEach(function(a){a.setAttribute('href',ig)});

  var o='<!DOCTYPE html>\n'+d.documentElement.outerHTML;
  o=o.replace(/var EN=\{[\s\S]*?\n\};/,function(){
    return 'var EN={\n'+Object.keys(en2).map(function(s){return '  '+JSON.stringify(s)+':'+JSON.stringify(en2[s])}).join(',\n')+'\n};';
  });
  if(OLDWA&&wa&&wa!==OLDWA)o=o.split(OLDWA).join(wa);

  var f=FONTS[$('font').value];
  o=o.replace(/family=[^"&]+(&amp;|&)display=swap/,function(m,x){return 'family='+f[1]+x+'display=swap'});
  o=o.replace(/font-family:'[^']+',Tahoma/,"font-family:'"+f[0]+"',Tahoma");
  return o;
}

function save(b,n){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove()}

$('pv').onclick=function(){
  var u=URL.createObjectURL(new Blob([build(true)],{type:'text/html'}));
  window.open(u,'_blank');
};
$('dl').onclick=function(){
  var o=build(false);
  if(!BL.length){save(new Blob([o],{type:'text/html'}),'index.html');return}
  var z=new JSZip();z.file('index.html',o);
  var fo=z.folder('images');
  BL.forEach(function(x){fo.file(x.n,x.b)});
  z.generateAsync({type:'blob'}).then(function(b){save(b,'site-update.zip')});
};
$('fi').onchange=function(){
  var r=new FileReader();
  r.onload=function(){load(r.result)};
  r.readAsText(this.files[0]);
};
fetch('index.html',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(load).catch(function(){$('st').textContent='';$('pick').hidden=false});
</script>
</body>
</html>
